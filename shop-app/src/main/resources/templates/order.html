<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Заказ</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/order.css}">
</head>

<body>
<div class="order-header">
    <a href="/orders"><b>ЗАКАЗЫ &cudarrr;</b></a>
    <a href="/cart/items"><b>КОРЗИНА &cudarrr;</b></a>
    <a href="/items"><b>ГЛАВНАЯ &cudarrr;</b></a>
</div>

<h1 class="order-success" th:if="${newOrder}">
    Поздравляем! Успешная покупка! 😊
</h1>

<div class="order-wrapper">
    <h2 th:text="${order.getName()}"></h2>

    <div class="order-items" th:each="item : ${items}">
        <div class="order-item-card">
            <a th:href="${'/items/'+ item.getId()}">
                <img class="order-item-image" th:src="@{'http://localhost:8888/items/images/'+ ${item.getId()}}" alt="Item image">
            </a>
            <div class="order-item-info">
                <div class="order-item-text" th:text="${item.getTextPreview()}"></div>
                <div class="order-item-quantity" th:text="${item.getQuantity()} + ' шт.'"></div>
                <div class="order-item-price" th:text="${item.getReadablePriceByQuantity()}"></div>
            </div>
        </div>
    </div>

    <h3 class="order-total" th:text="${'Сумма: ' + order.getTotalPrice()}"></h3>
</div>

</body>

</html>
